<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Contact Us | Clearwater Rafting Adventures</title>

    <meta name="description"
      content="Contact Clearwater Rafting Adventures for reservations, trip questions, and general inquiries. Find our location, phone number, and contact form.">
    <meta name="author" content="Angel Romero">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="The Logo Of Clearwater Rafting Adventures">

        <nav>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li> <a href="about.html">About Us</a></li>
                <li> <a href="trips.html">Trips</a></li>
                <li> <a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>
    </header>

    <main>
        <div class="company-info">
            <h1>Clearwater Rafting Adventures</h1>
            <p>2662 S 5600 W, West Valley City, UT 84120</p>
            <p>+1 999 999 9999</p>
            <p>info@clearwater.com</p>
        </div>
        <div class="layout">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d359.32920427828753!2d-112.02580941696165!3d40.712026200000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8752f33aee41f083%3A0x1fd4bc78b489c7c0!2sIsland%20Grinds!5e1!3m2!1ses!2sus!4v1781227234635!5m2!1ses!2sus"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>


            </div>

            <section class="contact-form">
                <h2>Send Us a Message</h2>

                <form action="#" method="post">

                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Purpose of Message</legend>

                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general"
                              required>
                            General Inquiry</label>

                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question</label>

                        <label for="website">
                            <input type="radio" id="website" name="purpose" value="website">
                            Website Suggestion</label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter"> Please subscribe
                        me to
                        the monthly newsletter. </label>


                    <button type="submit">Send Message</button>


                </form>
            </section>
        </div>

        <section class="rivers">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/emp-ang.jpg" alt="Angel Romero">
                <figcaption>Angel Romero - CEO</figcaption>
            </figure>

            <figure>
                <img src="images/emp-dex.jpg" alt="Dexter Romero">
                <figcaption>Dexter Romero - Instructor</figcaption>
            </figure>

            <figure>
                <img src="images/emp-dilone.jpg" alt="Angel Dilone">
                <figcaption>Angel Dilone - HH.RR manager</figcaption>
            </figure>

        </section>

    </main>


    <footer>
        <p>Clearwater Rafting Adventures &copy;2026 Angel Romero</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/VideosRodrigosLyricsSub/videos/rick-astley-never-gonna-give-you-up-official-video/442898693419478/"
              target="_blank">
                <img src="images/facebook-square-logo.svg" alt="Facebook Icon">
            </a>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">
                <img src="images/youtube-logo.svg" alt="Youtube Icon">
            </a>
            <a href="https://www.instagram.com/reel/C_dwFAcPNkT/?hl=es" target="_blank">
                <img src="images/instagram-square-logo.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
